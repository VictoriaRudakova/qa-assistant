[project]
name = "qa-assistant"
version = "0.1.0"
description = "QA engineering assistant: Jira story -> QA analysis -> manual test cases -> Xray CSV."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
qa-assistant-mcp = "qa_assistant.mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_assistant"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET", "PTH",
    "S",    # bandit
    "T20",  # no print(): stdout is the MCP transport
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert; obviously fake test tokens

[tool.ruff.lint.isort]
known-first-party = ["qa_assistant", "tests"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals", "scripts"]
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are deselected by default (and so never run in CI); opt in with `-m live`.
addopts = [
    "-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not live",
]
pythonpath = ["."]
markers = [
    "live: talks to a real Jira/Xray instance; opt-in via `-m live`, never runs in CI",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["qa_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

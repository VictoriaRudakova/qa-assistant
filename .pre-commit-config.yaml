repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # --enforce-all: also check files that are not newly staged (needed for CI runs).
        args: [--enforce-all, --maxkb=500]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: forbid-new-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src + tests)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-output-artifacts
        name: block generated artifacts under output/
        entry: generated artifacts must not be committed (output/ may contain Jira data)
        language: fail
        files: ^output/(?!\.gitkeep$)
